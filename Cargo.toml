[package]
name = "wrev"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Label-triggered pull request reviews with read-only GitHub tools"

[features]
default = ["quickjs-tools"]
quickjs-tools = ["dep:rquickjs"]
mysql-backend = ["dep:mysql", "dep:rustls"]

[dependencies]
sha2 = "0.10"
mysql = { version = "26", optional = true, default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
anyhow = "1"
config = { version = "0.15.27", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "form"] }
rmcp = { version = "3.10", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tiny_http = "0.12"
base64 = "0.22"
hmac = "0.12"
hex = "0.4"
octocrab = { version = "=0.54.9", default-features = false, features = ["default-client", "rustls", "rustls-ring"] }
rquickjs = { version = "=0.14.0", features = ["futures"], optional = true }

[target.'cfg(unix)'.dependencies]
rand = "0.8"
jsonwebtoken = "9"
fs2 = "0.4"

[lib]
name = "minimal_mcp_agent"

[[bin]]
name = "wrev"
path = "src/main.rs"
required-features = ["quickjs-tools"]
